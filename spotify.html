<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spotify.css">
    <link rel="stylesheet" href="utility.css">
    <title>Spotify</title>
</head>

<body>
    <div class="main">
        <img src="logo.svg" alt="Spotify-Logo" class="logo">
        <div class="home-icon">
            <img src="home.svg" alt="home-icon" class="home">
        </div>

        <div class="searchbox">
            <img src="search.svg" alt="search-icon" class="search">
            <input type="text" placeholder="What do you want to play?">
            <span class="vert-bar">|</span>
            <img src="browse.svg" alt="browse-icon" class="browse">
        </div>

        <div class="nav-right">
            <a href="#" class="nav-link">Premium</a>
            <a href="#" class="nav-link">Support</a>
            <a href="#" class="nav-link">Download</a>
            <span class="vertical-bar">|</span>
            <a href="#" class="install-btn">
                <img src="install.svg" alt="install-icon" class="install"> Install App
            </a>
            <button class="signup-btn">Sign up</button>
            <button class="login-btn">Log in</button>
        </div>
    </div>
</body>

</html>
